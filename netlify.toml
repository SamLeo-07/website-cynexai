[build]
  command = "npm run build"
  publish = "dist"
  functions = "attendance-backend"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/attendance/*"
  to = "/attendance/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
